# ==========================================================
# MDVRecetas 0.6.20 - Visualizador híbrido de recetas para Bedrock
#
# Solo se usa con jugadores Floodgate/Bedrock.
# Los jugadores Java conservan el GUI de inventario original.
#
# Buscador Bedrock:
# - por texto: nombre/ID de resultado, receta o ingrediente;
# - por inventario: eliges un objeto de tu inventario y se muestran
#   las recetas que lo utilizan. No depende del objeto de la mano.
#
# Al tocar una receta desde un Form se abre un inventario pequeño
# de 27 slots. Los 9 slots de la izquierda representan exactamente
# la mesa 3x3; a la derecha se muestran estación -> resultado.
#
# El bloque recipe.layout se conserva como fallback si desactivas
# recipe.hybrid-inventory.enabled.
# ==========================================================

type: "DYNAMIC_MDVRECETAS_GUIDE"

settings:
  # Recomendado para celular/consola para no crear Forms enormes.
  category-page-size: 8
  search-page-size: 8
  inventory-page-size: 8

main:
  title: "&8&lGuía de Recetas"
  content:
    - "&7Explora las recetas por categoría"
    - "&7o usa el buscador de ingredientes."
    - ""
    - "&7Recetas visibles: &e{total}"

  show-empty-categories: true

  # Tokens: {category}, {category_colored}, {count}
  category-button: "&e&l{category_colored}\n&r&7Recetas: &f{count}"

  search:
    text: "&b&lBuscar recetas\n&r&7Por nombre o por un objeto de tu inventario."

  back:
    text: "&6&lVolver"

  # Vacío = usa gui.main-back-command de config.yml.
  back-command: ""

category:
  title: "&8&l{category_colored}"
  content:
    - "&7Recetas: &f{total}"
    - "&7Página: &f{page}/{pages}"
  empty: "&7No hay recetas visibles en esta categoría."

  # Tokens: {result}, {result_amount}, {station}, {type}, {category}
  recipe-button: "&e&l{result}\n&r&7{station} &8• &7{type}"

  previous:
    text: "&e&lAnterior"
  next:
    text: "&e&lSiguiente"
  back:
    text: "&6&lVolver a categorías"

search:
  menu:
    title: "&8&lBuscador de Recetas"
    content:
      - "&7Busca escribiendo un nombre o selecciona"
      - "&7un objeto que ya tengas en tu inventario."
      - ""
      - "&7Objetos detectados: &e{inventory_items}"

    text-search:
      text: "&b&lBuscar por nombre\n&r&7Objeto, ingrediente o receta."

    inventory-search:
      text: "&a&lElegir objeto del inventario\n&r&7Busca recetas que utilicen uno de tus objetos."

    back:
      text: "&6&lVolver"

  # Selector que reemplaza al antiguo modo "objeto en mano".
  # exclude-main-hand: true evita que el Libro del Aventurero usado
  # para abrir el menú aparezca como opción de búsqueda.
  inventory:
    exclude-main-hand: true
    title: "&8&lElige un objeto"
    content:
      - "&7Selecciona un objeto de tu inventario."
      - "&7Verás las recetas que lo utilizan como ingrediente."
      - ""
      - "&7Página: &f{page}/{pages}"
    empty: "&7No tienes otros objetos disponibles para buscar."
    item-button: "&e&l{item}\n&r&7En inventario: &f{amount}"
    previous:
      text: "&e&lAnterior"
    next:
      text: "&e&lSiguiente"
    back:
      text: "&6&lVolver al buscador"

  input:
    title: "&8&lBuscar Receta"
    label: "&eNombre del objeto, ingrediente o receta"
    placeholder: "Ej: Espada Lunar, Nimbrel, hierro..."

  results:
    title: "&8&lResultados"
    content:
      - "&7Búsqueda: &e{query}"
      - "&7Resultados: &f{total}"
      - "&7Página: &f{page}/{pages}"
    empty: "&7No encontré recetas visibles con esa búsqueda."

    recipe-button: "&e&l{result}\n&r&7{category} &8• &7{station}"

    previous:
      text: "&e&lAnterior"
    next:
      text: "&e&lSiguiente"
    new-search:
      text: "&b&lNueva búsqueda"
    back:
      text: "&6&lVolver a categorías"

recipe:
  title: "&8&l{result}"

  # ----------------------------------------------------------
  # VISOR HÍBRIDO BEDROCK
  # ----------------------------------------------------------
  # Forms para navegar/buscar + inventario real para visualizar
  # físicamente la receta. El inventario es solo lectura.
  hybrid-inventory:
    enabled: true

    # 27 = cofre de 3 filas. Es el tamaño recomendado:
    # permite una cuadrícula 3x3 completa + estación + resultado.
    size: 27
    title: "&8&lVista de Receta"

    # Fondo fuera de la cuadrícula.
    background:
      material: BLACK_STAINED_GLASS_PANE
      name: " "

    # Cuadrícula real 3x3:
    #
    # [ 0][ 1][ 2] [ ][ ][ ][ ][ ][ ]
    # [ 9][10][11] [ ][13][14][15][ ][ ]
    # [18][19][20] [ ][22][ ][24][ ][26]
    #
    # En recetas SHAPED respeta exactamente la forma del YAML.
    # En SHAPELESS coloca los ingredientes consecutivamente.
    grid:
      slots:
        - 0
        - 1
        - 2
        - 9
        - 10
        - 11
        - 18
        - 19
        - 20

      # AIR deja las casillas vacías y hace más clara la forma.
      empty-material: AIR
      empty-name: " "

    ingredient:
      # Si el ingrediente también se fabrica en MDVRecetas,
      # tocarlo abre directamente su receta.
      linked-click: true
      lore:
        - ""
        - "&8Ingrediente &7• &e{amount}x"
      linked-lore:
        - "&bToca para ver cómo se fabrica."

    invalid-ingredient:
      name: "&cIngrediente inválido"
      lore:
        - "&7Revisa el YAML de esta receta."

    station:
      slot: 13
      name: "&6&l{station}"
      lore:
        - "&7Estación: &e{station}"
        - "&7Tipo: &f{type}"
        - "&7Variante: &f{variant}/{variants}"
      forjador-line: "&7Forjador: &e+{forjador_exp} EXP"
      cooking-time-line: "&7Tiempo: &e{cooking_time} ticks"
      vanilla-exp-line: "&7EXP vanilla: &e{vanilla_exp}"

    arrow:
      slot: 14
      material: SPECTRAL_ARROW
      name: "&e&l→ Resultado"
      lore:
        - "&7La receta produce el objeto"
        - "&7que aparece a la derecha."

    result:
      slot: 15
      lore:
        - ""
        - "&a&lResultado"
        - "&7Cantidad: &e{result_amount}"
        - "&7Categoría: &f{category}"
        - "&7Tipo: &f{type}"

    # Para horno/alto horno/ahumador/hoguera.
    cooking:
      ingredient-slot: 10

    previous-variant:
      slot: 22
      material: ARROW
      name: "&e&lVariante anterior"
      lore:
        - "&7Variante &e{variant}&7/&e{variants}"

    next-variant:
      slot: 24
      material: ARROW
      name: "&e&lSiguiente variante"
      lore:
        - "&7Variante &e{variant}&7/&e{variants}"

    back:
      slot: 26
      material: BARRIER
      name: "&6&lVolver"
      lore:
        - "&7Regresa al menú anterior."

  # Tokens disponibles:
  # {id}, {result}, {result_amount}, {category}, {category_colored},
  # {station}, {type}, {variant}, {variants}, {forjador_exp},
  # {cooking_time}, {vanilla_exp}
  #
  # Marcadores especiales de línea completa:
  # {layout}      -> distribución 3x3 si es SHAPED, explicación si
  #                  es SHAPELESS, o entrada -> salida si es COOKING.
  # {ingredients} -> lista dinámica de ingredientes.
  # {extra}       -> EXP Forjador / tiempo de cocción cuando corresponda.
  content:
    - "&e&l● &7&lResultado"
    - "&f{result} &7x{result_amount}"
    - ""
    - "&e&l● &7&lFabricación"
    - "&7Estación: &e{station}"
    - "&7Categoría: &f{category}"
    - "&7Tipo: &f{type}"
    - "&7Variante: &f{variant}/{variants}"
    - ""
    - "{layout}"
    - "&e&l● &7&lIngredientes"
    - "{ingredients}"
    - "{extra}"

  # Vista exacta de recetas con forma.
  # Ejemplo:
  # [A] [B] [A]
  # [ ] [B] [ ]
  # [ ] [C] [ ]
  # A = Piedra Lunar, B = Lingote, C = Palo
  layout:
    enabled: true
    shaped-title: "&e&l● &7&lForma en la mesa 3x3"
    shaped-row: "&8[&e{c1}&8] [&e{c2}&8] [&e{c3}&8]"
    legend-title: "&8Leyenda:"
    legend-line: "&e{symbol} &8= &f{amount}x &7{ingredient}"

    shapeless-title: "&e&l● &7&lColocación"
    shapeless-line: "&7Sin forma: coloca los ingredientes en cualquier orden."

    cooking-title: "&e&l● &7&lProceso"
    cooking-line: "&f{ingredient_amount}x {ingredient} &8→ &e{result_amount}x {result}"

  ingredient-line: "&7• &f{amount}x &e{ingredient}"
  no-ingredients: "&8Sin ingredientes visibles."
  forjador-line: "&7EXP de Forjador: &e+{forjador_exp}"
  cooking-time-line: "&7Tiempo: &e{cooking_time} ticks"
  vanilla-exp-line: "&7EXP vanilla: &e{vanilla_exp}"

  previous-variant:
    text: "&e&lVariante anterior\n&r&7{variant}/{variants}"
  next-variant:
    text: "&e&lSiguiente variante\n&r&7{variant}/{variants}"

  linked-ingredients:
    enabled: true
    max-buttons: 6
    button: "&b&lVer receta de {ingredient}\n&r&7Resultado: {result}"

  back:
    text: "&6&lVolver"
