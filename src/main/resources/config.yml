# ==========================================================
# MDVRecetas 0.6.5
# Motor de recetas custom + guía visual tipo Terraria.
# ==========================================================

settings:
  debug: false
  recipe-folder: recipes

forjador:
  enabled: true
  profession-id: forjador
  notify-xp: true
  # Opciones: HOLOGRAM, CHAT, BOTH, NONE
  notify-mode: HOLOGRAM
  # Comando ejecutado desde consola.
  # MMOCore: /mmocore admin exp give <player> <profession/main> <value> <split>
  command: 'mmocore admin exp give %player% %profession% %xp% false'
  message: '&8[&6Forjador&8] &7Has ganado &e%xp% XP &7por fabricar &f%recipe%&7.'
  hologram:
    enabled: true
    text: '&e+%xp%EXP!'
    y-offset: 1.35
    duration-ticks: 35
    view-range: 24.0

signature:
  enabled: true
  # Compatibilidad vieja: lore-line sigue funcionando si lore-lines no existe.
  lore-line: '&a &7🔨 &l&aForjado por: &e%player%'
  lore-lines:
    - ''
    - '&a &7🔨 &l&aForjado por: &e%player%'


# ==========================================================
# Modificadores por Forjador
#
# Desde MDVRecetas 0.6.3, la tabla de calidades, chances,
# bloqueados y pesos vive en plugins/MDVRecetas/modifiers.yml
# para que config.yml no quede gigante.
# ==========================================================

gui:
  main-back-command: 'mdvsocial'

  titles:
    main: '&8&lGuía de Recetas'
    category: '&8&lRecetas %category%'
    search: '&8&lBuscador de Recetas'
    recipe: '&8&lVista de Receta'
    admin-main: '&8&lAdmin Recetas'
    admin-category: '&8&lAdmin %category%'

  buttons:
    back-texture: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmQ2OWUwNmU1ZGFkZmQ4NGU1ZjNkMWMyMTA2M2YyNTUzYjJmYTk0NWVlMWQ0ZDcxNTJmZGM1NDI1YmMxMmE5In19fQ=='

  main:
    # Menú principal: categorías arriba con margen izquierdo/derecho.
    category-slots: [1,2,3,4,5,6,7,11,12,13,14,15,16,17]
    back-slot: 45
    previous-slot: 46
    next-slot: 52

  category:
    # Visualizador de categoría. Las flechas solo aparecen si hay más páginas.
    recipe-slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34,37,38,39,40,41,42,43]
    back-slot: 49
    previous-slot: 45
    next-slot: 53

  search:
    # Buscador tipo Terraria.
    # El jugador pone un objeto en center-slot.
    center-slot: 40
    border-slots: [30,31,32,39,41,48,49,50]
    info-slot: 38
    inactive-pane: RED_STAINED_GLASS_PANE
    active-pane: LIME_STAINED_GLASS_PANE
    recipe-slots: [1,2,3,4,5,6,7,10,11,12,13,14,15,16,19,20,21,22,23,24,25]
    back-slot: 45
    previous-slot: 46
    next-slot: 52
    info-name: '&eBuscador de ingredientes'
    info-lore:
      - '&7Pon un objeto en el centro'
      - '&7para ver qué crafteos puedes'
      - '&7hacer con él.'

  recipe:
    # Vista de receta completa.
    # 3x3 de ingredientes a la izquierda/centro, estación al medio, resultado a la derecha.
    ingredient-slots: [10,11,12,19,20,21,28,29,30]
    cooking-ingredient-slot: 20
    station-slot: 23
    result-slot: 25
    back-slot: 45
    # Recetas vinculadas: cada cuantos ticks cambia la variante mostrada. 30 ticks = 1.5s.
    linked-cycle-ticks: 30

  categories:
    ARMAS_CUERPO_A_CUERPO:
      name: '&cArmas cuerpo a cuerpo'
      icon: IRON_SWORD
    ARMAS_A_DISTANCIA:
      name: '&aArmas a distancia'
      icon: BOW
    ARMAS_MAGICAS:
      name: '&9Armas mágicas'
      icon: BLAZE_ROD
    SOPORTE_MAGICO:
      name: '&dSoporte mágico'
      icon: ENCHANTED_BOOK
    ARMADURAS:
      name: '&6Armaduras'
      icon: IRON_CHESTPLATE
    HERRAMIENTAS:
      name: '&7Herramientas'
      icon: IRON_PICKAXE
    AGRICULTURA:
      name: '&aAgricultura'
      icon: WHEAT
    CONSUMIBLES:
      name: '&eConsumibles'
      icon: HONEY_BOTTLE
    MATERIALES:
      name: '&fMateriales'
      icon: IRON_INGOT
    REPARACIONES:
      name: '&bReparaciones'
      icon: ANVIL
    UTILITARIOS:
      name: '&5Utilitarios'
      icon: COMPASS


editor:
  # Archivo inicial para recetas nuevas. Los demás .yml/.yaml de recipes/ aparecen en el editor.
  default-save-file: editor.yml
  titles:
    station-select: '&8&lEditor de Recetas'
    creator: '&8&lCrear Receta'
    options: '&8&lOpciones de Receta'
  station-select:
    close-slot: 40

messages:
  prefix: '&8[&6MDVRecetas&8] &r'
  no-permission: '&cNo tienes permiso.'
  reload-start: '&7Recargando recetas...'
  reload-done: '&aRecetas recargadas. &7Registradas: &e%count%&7.'
  reload-fail: '&cNo se pudieron recargar las recetas. Revisa la consola.'
  player-only: '&cEste comando solo puede usarlo un jugador.'
  no-item-in-hand: '&cDebes sostener un item en la mano principal.'
  debug-header: '&6Item en mano:'
  serialize-saved: '&aItem guardado en &e%file%&a.'
