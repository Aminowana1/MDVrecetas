name: MDVRecetas
version: 0.6.20
main: com.mdvcraft.mdvrecetas.MDVRecetasPlugin
api-version: '1.21'
author: MDVCRAFT
website: https://mdvcraft.xyz
depend:
  - MMOItems
  - MMOCore
softdepend:
  - MDVSocial
  - PlaceholderAPI
  - floodgate
commands:
  mdvrecetas:
    description: Comando principal de MDVRecetas.
    usage: /mdvrecetas [admin|editor|reload|debugitem|debugforjador|serializehand]
    aliases: [recetas, mdvrecipes]
permissions:
  mdvrecetas.admin:
    description: Permite administrar, recargar y editar recetas existentes.
    default: op
    children:
      mdvrecetas.editor: true
  mdvrecetas.editor:
    description: Permite crear recetas nuevas desde /mdvrecetas editor, sin editar las existentes.
    default: op
  mdvrecetas.use:
    description: Permite abrir la guía de recetas.
    default: true
